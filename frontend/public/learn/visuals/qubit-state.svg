<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="qubit-state-title qubit-state-desc"><title id="qubit-state-title">A single pure qubit</title><desc id="qubit-state-desc">One original complex-amplitude example, shown on a projected Bloch sphere.</desc><rect width="960" height="560" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A single pure qubit</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">One original complex-amplitude example, shown on a projected Bloch sphere.</text><circle cx="295" cy="315" r="150" fill="#faf8ff" stroke="#c4b5fd" stroke-width="2"/><ellipse cx="295" cy="315" rx="150" ry="75" fill="none" stroke="#c4b5fd"/><line x1="370" y1="379.9519052838329" x2="220" y2="250.0480947161671" stroke="#62556f" stroke-width="2" /><line x1="165.0961894323342" y1="352.5" x2="424.9038105676658" y2="277.5" stroke="#62556f" stroke-width="2" /><line x1="295" y1="444.9038105676658" x2="295" y2="185.0961894323342" stroke="#62556f" stroke-width="2" /><text x="295" y="170" font-size="20" fill="#221536" text-anchor="middle">|0&gt;  +Z</text><text x="295" y="478" font-size="20" fill="#221536" text-anchor="middle">|1&gt;  −Z</text><text x="185" y="247" font-size="20" fill="#221536" text-anchor="start">+X</text><text x="432" y="282" font-size="20" fill="#221536" text-anchor="start">+Y</text><line x1="295" y1="315" x2="407.5" y2="217.57214207425065" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#7c3aed"/></marker></defs><text x="550" y="205" font-size="24" fill="#7c3aed" text-anchor="start">θ = π/3; φ = π/2</text><text x="550" y="252" font-size="22" fill="#221536" text-anchor="start">Bloch vector:</text><text x="550" y="288" font-size="24" fill="#221536" text-anchor="start">(0, √3/2, 1/2)</text><text x="550" y="350" font-size="24" fill="#221536" text-anchor="start">P(0) = 3/4</text><text x="550" y="389" font-size="24" fill="#221536" text-anchor="start">P(1) = 1/4</text><text x="540" y="450" font-size="18" fill="#62556f" text-anchor="start">Projected sphere; the arrow is</text><text x="540" y="476" font-size="18" fill="#62556f" text-anchor="start">a state, not a spatial orbit.</text></g></svg>
