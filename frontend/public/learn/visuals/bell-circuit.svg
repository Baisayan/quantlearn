<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="bell-circuit-title bell-circuit-desc"><title id="bell-circuit-title">Preparing a Bell pair</title><desc id="bell-circuit-desc">H creates two branches; CX correlates the target with the control.</desc><rect width="960" height="430" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Preparing a Bell pair</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">H creates two branches; CX correlates the target with the control.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: |0&gt;</text><line x1="135" y1="175" x2="905" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="267" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="135" y1="260" x2="905" y2="260" stroke="#62556f" stroke-width="2" /><rect x="152" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><line x1="290" y1="175" x2="290" y2="260" stroke="#7c3aed" stroke-width="2" /><circle cx="290" cy="175" r="6" fill="#7c3aed"/><circle cx="290" cy="260" r="17" fill="#fff" stroke="#7c3aed" stroke-width="2"/><line x1="278" y1="260" x2="302" y2="260" stroke="#7c3aed" stroke-width="2" /><line x1="290" y1="248" x2="290" y2="272" stroke="#7c3aed" stroke-width="2" /><rect x="384" y="154" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="405" y="182" font-size="18" fill="#221536" text-anchor="middle">M</text><rect x="384" y="239" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="405" y="267" font-size="18" fill="#221536" text-anchor="middle">M</text><text x="40" y="350" font-size="18" fill="#62556f" text-anchor="start">Before measurement: (|00&gt; + |11&gt;)/√2. Exact probabilities: [1/2, 0, 0, 1/2].</text></g></svg>
