<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="rotation-bloch-title rotation-bloch-desc"><title id="rotation-bloch-title">The same Ry angle in three views</title><desc id="rotation-bloch-desc">A Y rotation moves a pure state along a great circle while changing Z probabilities.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">The same Ry angle in three views</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A Y rotation moves a pure state along a great circle while changing Z probabilities.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">θ</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State from |0&gt;</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">P(1)</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt;</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">π/2</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">(|0&gt; + |1&gt;)/√2</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">1/2</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">π</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">|1&gt;</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">2π</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">−|0&gt;</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">0; global phase</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
