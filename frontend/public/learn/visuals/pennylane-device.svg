<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="pennylane-device-title pennylane-device-desc"><title id="pennylane-device-title">A PennyLane device is an execution target</title><desc id="pennylane-device-desc">default.qubit is a local ideal simulator for this module, not a physical quantum processor or automatic cloud job.</desc><rect width="960" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A PennyLane device is an execution target</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">default.qubit is a local ideal simulator for this module, not a physical quantum processor</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">or automatic cloud job.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Concept</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Meaning</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Device</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">qml.device('default.qubit',</text><text x="347.3333333333333" y="236" font-size="19" fill="#221536" text-anchor="start">wires=2)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Backend and wire space</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Wires</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">0, 1</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Integer labels for</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">operations</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="78" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Shots</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">shots=1024</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">Finite sampling when</text><text x="640.6666666666666" y="392" font-size="19" fill="#221536" text-anchor="start">requested</text><line x1="40" y1="413" x2="920" y2="413" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="413" width="880" height="51" fill="#fff"/><text x="54" y="443" font-size="19" fill="#221536" text-anchor="start">Backend</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">default.qubit</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">Classical ideal simulation</text><line x1="40" y1="464" x2="920" y2="464" stroke="#ddd6e8" stroke-width="2" /></g></svg>
