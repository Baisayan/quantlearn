<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="cirq-ordering-title cirq-ordering-desc"><title id="cirq-ordering-title">Explicit Cirq order prevents idle-wire surprises</title><desc id="cirq-ordering-desc">A circuit's active qubits and its requested tensor order are not always the same thing.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Explicit Cirq order prevents idle-wire surprises</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A circuit's active qubits and its requested tensor order are not always the same thing.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Check</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Correct choice</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Failure if omitted</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Idle q1</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Include q1 in qubit_order</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">One-qubit state instead of</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">two</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="51" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">State array</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">[q1,q0]</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">01 and 10 swapped</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="51" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Measurement</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">measure(q1,q0)</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Printed key order reversed</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Gate meaning</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Keep q0 control</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Operation itself is not</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">swapped</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
