<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="dj-query-cost-title dj-query-cost-desc"><title id="dj-query-cost-title">Query complexity is not the whole implementation cost</title><desc id="dj-query-cost-desc">The one-query claim counts calls to a black-box oracle, while a real circuit still needs gates to build that oracle.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Query complexity is not the whole implementation cost</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The one-query claim counts calls to a black-box oracle, while a real circuit still needs</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">gates to build that oracle.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Setting</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Classical queries</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Quantum queries</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Promise: n input bits</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Worst case 2^(n−1)+1</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">1 oracle call</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">n=2 example</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">3 in worst case</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Practical circuit</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Oracle gates depend on f</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Construction and depth</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">still matter</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /></g></svg>
