<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-labelledby="tensor-products-title tensor-products-desc"><title id="tensor-products-title">Tensor product expands every basis pair</title><desc id="tensor-products-desc">Multiply q1's entry by q0's entry and preserve the declared |q1q0&gt; order.</desc><rect width="960" height="344" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Tensor product expands every basis pair</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Multiply q1's entry by q0's entry and preserve the declared |q1q0&gt; order.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">q1 ⊗ q0</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Basis amplitudes</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Probabilities</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt; ⊗ |+&gt;</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">[1/√2, 1/√2, 0, 0]</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">[1/2, 1/2, 0, 0]</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">[√3/2,1/2] ⊗ |+&gt;</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">[√3/(2√2), √3/(2√2),</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">1/(2√2), 1/(2√2)]</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">[3/8, 3/8, 1/8, 1/8]</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /></g></svg>
