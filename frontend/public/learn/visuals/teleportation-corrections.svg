<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="teleportation-corrections-title teleportation-corrections-desc"><title id="teleportation-corrections-title">Teleportation branch table</title><desc id="teleportation-corrections-desc">The column heading defines outcome order m0m1; each ideal branch has probability 1/4.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Teleportation branch table</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The column heading defines outcome order m0m1; each ideal branch has probability 1/4.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">m0m1</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Bob before correction</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Bob applies in time order</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">00</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">ψ</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">I</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">01</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Xψ</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">X</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">10</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Zψ</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Z</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">11</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">XZψ</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">X, then Z</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
