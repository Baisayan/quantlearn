<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="cirq-bell-title cirq-bell-desc"><title id="cirq-bell-title">The Bell circuit in Cirq notation</title><desc id="cirq-bell-desc">The same H and CNOT experiment can be read as a sequence of named qubit operations and a keyed measurement.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">The Bell circuit in Cirq notation</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The same H and CNOT experiment can be read as a sequence of named qubit operations and a</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">keyed measurement.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Line</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Cirq operation</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Expected ideal result</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Prepare</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">cirq.H(q0)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">q0 becomes |+&gt;</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Entangle</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">cirq.CNOT(q0,q1)</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Bell pair</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Measure</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">cirq.measure(q1,q0,key='bits')</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">00 or 11</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Exact check</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">simulate before measure</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">[1/√2,0,0,1/√2]</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
