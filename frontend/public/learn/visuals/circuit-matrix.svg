<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="circuit-matrix-title circuit-matrix-desc"><title id="circuit-matrix-title">Circuit order versus matrix order</title><desc id="circuit-matrix-desc">Read circuit time left to right, then write the rightmost matrix first when composing operators.</desc><rect width="960" height="368" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Circuit order versus matrix order</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Read circuit time left to right, then write the rightmost matrix first when composing</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">operators.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Circuit time</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State update</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Operator product</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">H then Z</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt; → H|0&gt; → ZH|0&gt;</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">ZH</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Z then H</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">|0&gt; → Z|0&gt; → HZ|0&gt;</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">HZ</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Measurement</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">State → classical bit</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Not a unitary matrix</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /></g></svg>
