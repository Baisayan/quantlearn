<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="framework-choice-title framework-choice-desc"><title id="framework-choice-title">Choose the framework by the question</title><desc id="framework-choice-desc">Framework choice is an engineering decision; equivalent ideal probabilities do not make APIs interchangeable in every workflow.</desc><rect width="960" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Choose the framework by the question</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Framework choice is an engineering decision; equivalent ideal probabilities do not make</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">APIs interchangeable in every workflow.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Question</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Useful starting point</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Reason</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Counts and transpilation</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Qiskit Aer</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit and target</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">pipeline</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Moment-level circuit</text><text x="54" y="314" font-size="19" fill="#221536" text-anchor="start">reasoning</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">Cirq</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Explicit qubits and</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">moments</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="51" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Differentiable parameters</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">PennyLane</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">QNodes and gradients</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="386" width="880" height="78" fill="#fff"/><text x="54" y="416" font-size="19" fill="#221536" text-anchor="start">Cross-check</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">All three</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">Normalize order and</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">compare</text><line x1="40" y1="464" x2="920" y2="464" stroke="#ddd6e8" stroke-width="2" /></g></svg>
