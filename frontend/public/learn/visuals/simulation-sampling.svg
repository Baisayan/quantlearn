<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="simulation-sampling-title simulation-sampling-desc"><title id="simulation-sampling-title">Exact distribution versus finite shots</title><desc id="simulation-sampling-desc">A fixed ideal distribution produces different finite counts while the exact probabilities stay unchanged.</desc><rect width="960" height="515" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Exact distribution versus finite shots</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A fixed ideal distribution produces different finite counts while the exact probabilities</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">stay unchanged.</text><rect x="80" y="116" width="18" height="18" fill="#7c3aed"/><text x="106" y="132" font-size="18" fill="#221536" text-anchor="start">Exact</text><rect x="360" y="116" width="18" height="18" fill="#c4b5fd"/><text x="386" y="132" font-size="18" fill="#221536" text-anchor="start">32 shots</text><rect x="640" y="116" width="18" height="18" fill="#a78bfa"/><text x="666" y="132" font-size="18" fill="#221536" text-anchor="start">128 shots</text><line x1="78" y1="370" x2="905" y2="370" stroke="#62556f" stroke-width="2" /><text x="66" y="376" font-size="17" fill="#62556f" text-anchor="end">0</text><line x1="78" y1="265" x2="905" y2="265" stroke="#eee8f5" stroke-width="2" /><text x="66" y="271" font-size="17" fill="#62556f" text-anchor="end">0.5</text><line x1="78" y1="160" x2="905" y2="160" stroke="#eee8f5" stroke-width="2" /><text x="66" y="166" font-size="17" fill="#62556f" text-anchor="end">1</text><rect x="106" y="265" width="55.333333333333336" height="105" fill="#7c3aed"/><text x="133.66666666666666" y="256" font-size="17" fill="#221536" text-anchor="middle">0.5</text><rect x="165.33333333333334" y="265" width="55.333333333333336" height="105" fill="#c4b5f