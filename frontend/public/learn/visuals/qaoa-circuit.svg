<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="qaoa-circuit-title qaoa-circuit-desc"><title id="qaoa-circuit-title">QAOA: one edge, one layer</title><desc id="qaoa-circuit-desc">Maximize C=(I−Z0Z1)/2 with γ=π/2 and β=π/8. Rotation labels are radians.</desc><rect width="960" height="430" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">QAOA: one edge, one layer</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Maximize C=(I−Z0Z1)/2 with γ=π/2 and β=π/8. Rotation labels are radians.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: |0&gt;</text><line x1="135" y1="175" x2="905" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="267" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="135" y1="260" x2="905" y2="260" stroke="#62556f" stroke-width="2" /><rect x="152" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="152" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="248" y="152" width="84" height="131" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="290" y="213.5" font-size="18" fill="#7c3aed" text-anchor="middle">RZZ</text><text x="290" y="241.5" font-size="18" fill="#7c3aed" text-anchor="middle">-π/2</text><rect x="382" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="405" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">RX</text><text x="405" y="221" font-size="16" fill="#62556f" text-anchor="middle">π/4</text><rect x="382" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="405" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">RX</text><text x="405" y="306" font-size="16" fill="#62556f" text-anchor="middle">π/4</text><rect x="499" y="154" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="520" y="182" font-size="18" fill="#221536" text-anchor="middle">M</text><rect x="499" y="239" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="520" y="267" font-size="18" fill="#221536" text-anchor="middle">M</text><text x="40" y="350" font-size="18" fill="#62556f" text-anchor="start">Cost: RZZ(−γ), up to global phase. Mixer: RX(2β) on each qubit. P(01)=P(10)=1/2.</text></g></svg>
