<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="oracle-truth-table-title oracle-truth-table-desc"><title id="oracle-truth-table-title">Truth tables expose the oracle action</title><desc id="oracle-truth-table-desc">For a two-input example, the same Boolean function has different visible effects depending on the helper state.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Truth tables expose the oracle action</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">For a two-input example, the same Boolean function has different visible effects depending</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">on the helper state.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">f(x)</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">f(00), f(01), f(10), f(11)</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Helper |0&gt; / |-&gt;</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">constant zero</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0, 0, 0, 0</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">bit unchanged / phase +</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">constant one</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">1, 1, 1, 1</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">bit flips / phase −</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">XOR</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">0, 1, 1, 0</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">conditional flip / signs</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">+,−,−,+</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /></g></svg>
