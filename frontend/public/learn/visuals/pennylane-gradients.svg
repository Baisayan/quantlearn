<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="pennylane-gradients-title pennylane-gradients-desc"><title id="pennylane-gradients-title">A parameter can be differentiated through a QNode</title><desc id="pennylane-gradients-desc">Gradients support the classical optimization loop when the device, measurements and interface support differentiation.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A parameter can be differentiated through a QNode</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Gradients support the classical optimization loop when the device, measurements and</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">interface support differentiation.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Step</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Meaning</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Parameter</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">theta</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Trainable circuit input</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Ansatz</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">RY(theta)</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">State changes with theta</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Objective</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">expval(Z)</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Scalar to optimize</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="78" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Gradient</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">qml.grad(cost)(theta)</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Local slope estimate or</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">analytic rule</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
