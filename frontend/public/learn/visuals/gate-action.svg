<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="gate-action-title gate-action-desc"><title id="gate-action-title">Gate action on a general state</title><desc id="gate-action-desc">Apply each matrix to [α, β]ᵀ one row at a time; phases remain part of the output.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Gate action on a general state</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Apply each matrix to [α, β]ᵀ one row at a time; phases remain part of the output.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Gate</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Input</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Output</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">X</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">[α, β]ᵀ</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">[β, α]ᵀ</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Z</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">[α, β]ᵀ</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">[α, −β]ᵀ</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Y</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">[α, β]ᵀ</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">[−iβ, iα]ᵀ</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">H</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">[α, β]ᵀ</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">[(α+β)/√2, (α−β)/√2]ᵀ</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
