<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="reduced-state-title reduced-state-desc"><title id="reduced-state-title">Partial trace removes a subsystem</title><desc id="reduced-state-desc">Summing over the discarded subsystem keeps every prediction available to the subsystem that remains.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Partial trace removes a subsystem</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Summing over the discarded subsystem keeps every prediction available to the subsystem</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">that remains.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Joint state</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Reduced state of q1</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Local description</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">|00&gt;&lt;00|</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt;&lt;0|</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Pure north-pole state</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">|Φ+&gt;&lt;Φ+|</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">I/2</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Maximally mixed</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">00/11 mixture</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">I/2</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Same local statistics</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Bell coherence</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">Lost locally</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Still present jointly</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
