<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="simulation-views-title simulation-views-desc"><title id="simulation-views-title">One circuit, four complementary result views</title><desc id="simulation-views-desc">Each panel answers a different question. Exact state, sampled counts and local summaries must be labeled separately.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">One circuit, four complementary result views</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Each panel answers a different question. Exact state, sampled counts and local summaries</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">must be labeled separately.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">View</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Shows</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Does not show</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Operations and order</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">The measured result</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Statevector</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Pure amplitudes and phase</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Finite-shot variation</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Histogram</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Sampled or exact</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">probabilities</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Unmeasured phase directly</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Density matrix / Bloch</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Mixture, coherence or</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">local state</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Every joint correlation in</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">a local sphere</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
