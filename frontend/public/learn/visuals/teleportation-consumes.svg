<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="teleportation-consumes-title teleportation-consumes-desc"><title id="teleportation-consumes-title">Teleportation moves a state, not a copy</title><desc id="teleportation-consumes-desc">The input is measured and consumed while Bob reconstructs the state conditionally.</desc><rect width="960" height="400" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Teleportation moves a state, not a copy</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The input is measured and consumed while Bob reconstructs the state conditionally.</text><line x1="150" y1="200" x2="810" y2="200" stroke="#62556f" stroke-width="2" /><text x="55" y="206" font-size="19" fill="#62556f" text-anchor="start">before</text><rect x="180" y="177" width="110" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="235" y="206" font-size="20" fill="#7c3aed" text-anchor="middle">|ψ&gt;</text><line x1="290" y1="200" x2="430" y2="200" stroke="#7c3aed" stroke-width="2" /><rect x="430" y="177" width="110" height="46" rx="6" fill="#f0fdf4" stroke="#7c3aed"/><text x="485" y="206" font-size="19" fill="#21845b" text-anchor="middle">measure</text><line x1="540" y1="200" x2="670" y2="200" stroke="#7c3aed" stroke-width="2" /><rect x="670" y="177" width="110" height="46" rx="6" fill="#fff" stroke="#7c3aed"/><text x="725" y="206" font-size="19" fill="#221536" text-anchor="middle">no |ψ&gt;</text><text x="185" y="315" font-size="20" fill="#62556f" text-anchor="start">Alice's input is consumed by her measurements; Bob's state becomes useful only after m0 and m1 arrive.</text></g></svg>
