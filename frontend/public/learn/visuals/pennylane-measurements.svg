<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="pennylane-measurements-title pennylane-measurements-desc"><title id="pennylane-measurements-title">Measurement returns choose the result type</title><desc id="pennylane-measurements-desc">State, probabilities, counts and expectations are distinct return contracts.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Measurement returns choose the result type</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">State, probabilities, counts and expectations are distinct return contracts.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Return</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Result</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Typical use</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">qml.state()</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Complex amplitudes</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Exact pure-state</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">inspection</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="51" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">qml.probs()</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">Basis probabilities</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Exact distribution</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="51" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">qml.counts()</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">Finite count map</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Shots and histograms</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="51" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">qml.expval(PauliZ)</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Signed average</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Cost or energy term</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
