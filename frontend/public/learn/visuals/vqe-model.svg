<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="vqe-model-title vqe-model-desc"><title id="vqe-model-title">VQE searches a variational energy curve</title><desc id="vqe-model-desc">The ansatz Ry(θ)|0&gt; prepares a controllable one-qubit state for H=Z+0.5X.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">VQE searches a variational energy curve</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The ansatz Ry(θ)|0&gt; prepares a controllable one-qubit state for H=Z+0.5X.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Object</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Definition</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Role</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Ansatz</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|ψ(θ)&gt; = Ry(θ)|0&gt;</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Search family</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Hamiltonian</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">H = Z + 0.5X</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Energy operator</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Energy</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">E(θ)=&lt;ψ(θ)|H|ψ(θ)&gt;</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Objective to minimize</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Exact minimum</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">−√1.25 ≈ −1.118</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Benchmark</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
