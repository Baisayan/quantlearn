<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="circuit-model-title circuit-model-desc"><title id="circuit-model-title">A circuit has quantum and classical time</title><desc id="circuit-model-desc">Unitary gates transform the state; measurement creates a classical output that can control later operations.</desc><rect width="960" height="410" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A circuit has quantum and classical time</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Unitary gates transform the state; measurement creates a classical output that can control</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">later operations.</text><line x1="125" y1="190" x2="845" y2="190" stroke="#62556f" stroke-width="2" /><line x1="125" y1="300" x2="845" y2="300" stroke="#62556f" stroke-width="2" /><text x="55" y="196" font-size="18" fill="#62556f" text-anchor="start">quantum</text><text x="55" y="306" font-size="18" fill="#62556f" text-anchor="start">classical</text><rect x="180" y="167" width="70" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="215" y="196" font-size="20" fill="#7c3aed" text-anchor="middle">H</text><rect x="330" y="167" width="70" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="365" y="196" font-size="20" fill="#7c3aed" text-anchor="middle">Z</text><rect x="480" y="167" width="70" height="46" rx="6" fill="#fff" stroke="#7c3aed"/><text x="515" y="196" font-size="20" fill="#221536" text-anchor="middle">M</text><line x1="515" y1="213" x2="515" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><rect x="480" y="277" width="70" height="46" rx="6" fill="#f0fdf4" stroke="#7c3aed"/><text x="515" y="306" font-size="18" fill="#21845b" text-anchor="middle">0 / 1</text><text x="180" y="130" font-size="19" fill="#7c3aed" text-anchor="start">unitary state evolution</text><text x="570" y="258" font-size="19" fill="#21845b" text-anchor="start">classical record</text></g></svg>
