<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="cirq-timeline-title cirq-timeline-desc"><title id="cirq-timeline-title">Cirq places operations into moments</title><desc id="cirq-timeline-desc">A Cirq circuit is organized by qubit objects and moments, so parallel operations share a time slice when they do not conflict.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Cirq places operations into moments</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A Cirq circuit is organized by qubit objects and moments, so parallel operations share a</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">time slice when they do not conflict.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Concept</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Cirq example</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Meaning</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Qubit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">LineQubit(0)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Named quantum wire</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Operation</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">cirq.H(q0)</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Gate applied to a qubit</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Moment</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">same time column</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Non-conflicting operations</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">can align</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">cirq.Circuit(...)</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Ordered operation</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">collection</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
