<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="vqe-optimizer-title vqe-optimizer-desc"><title id="vqe-optimizer-title">A classical optimizer follows measured energy</title><desc id="vqe-optimizer-desc">The optimizer uses noisy evaluations, so a replayable teaching trace should show both the proposal and the measured estimate.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A classical optimizer follows measured energy</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The optimizer uses noisy evaluations, so a replayable teaching trace should show both the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">proposal and the measured estimate.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Step</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">θ</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Exact E(θ)</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Start</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">1.000</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Probe</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">π/2</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">0.500</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Move</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">π+arctan(0.5)</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">−1.118</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="78" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Check</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">near optimum</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Cannot beat the ground</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">energy</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
