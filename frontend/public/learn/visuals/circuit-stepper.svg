<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="circuit-stepper-title circuit-stepper-desc"><title id="circuit-stepper-title">State after each circuit moment</title><desc id="circuit-stepper-desc">The same circuit can be inspected step by step before the final classical readout.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">State after each circuit moment</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The same circuit can be inspected step by step before the final classical readout.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Moment</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Operation</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State from |0&gt;</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Prepare</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt;</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">1</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">H</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">|+&gt;</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">2</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Z</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">|-&gt;</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="78" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">3</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">M in Z</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">0 or 1; probabilities 1/2,</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">1/2</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
