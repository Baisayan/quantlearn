<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="no-signalling-title no-signalling-desc"><title id="no-signalling-title">Correlation is not a communication channel</title><desc id="no-signalling-desc">Bob's unconditioned local state remains the same no matter which measurement basis Alice chooses.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Correlation is not a communication channel</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Bob's unconditioned local state remains the same no matter which measurement basis Alice</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">chooses.</text><rect x="40" y="128" width="880" height="78" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Alice's action</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Bob's local state before</text><text x="347.3333333333333" y="185" font-size="19" fill="#7c3aed" text-anchor="start">the result</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Can Bob decode a chosen</text><text x="640.6666666666666" y="185" font-size="19" fill="#7c3aed" text-anchor="start">bit?</text><line x1="40" y1="206" x2="920" y2="206" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="206" width="880" height="51" fill="#faf8ff"/><text x="54" y="236" font-size="19" fill="#221536" text-anchor="start">Measure Z</text><text x="347.3333333333333" y="236" font-size="19" fill="#221536" text-anchor="start">I/2</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">No</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="51" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Measure X</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">I/2</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">No</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="51" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Do nothing</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">I/2</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">No</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Compare later</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Correlations become</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">visible</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Only after classical</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">communication</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
