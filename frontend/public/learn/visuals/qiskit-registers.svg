<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="qiskit-registers-title qiskit-registers-desc"><title id="qiskit-registers-title">Quantum and classical registers have different jobs</title><desc id="qiskit-registers-desc">Quantum bits carry the state; classical bits receive measurement outcomes and use the declared mapping.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Quantum and classical registers have different jobs</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Quantum bits carry the state; classical bits receive measurement outcomes and use the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">declared mapping.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Register</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Role</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Quantum</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">QuantumRegister(2)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Two qubits for gates</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Classical</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">ClassicalRegister(2)</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Two stored output bits</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Measure</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">measure([0,1],[0,1])</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Copy outcomes into</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">classical storage</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Result</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">counts</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Frequency map whose values</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">sum to shots</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
