<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="qiskit-ordering-title qiskit-ordering-desc"><title id="qiskit-ordering-title">Qiskit output order needs an explicit convention</title><desc id="qiskit-ordering-desc">Qiskit displays multi-bit strings with the highest-index classical bit on the left, while q0 is the least significant bit.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Qiskit output order needs an explicit convention</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Qiskit displays multi-bit strings with the highest-index classical bit on the left, while</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">q0 is the least significant bit.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Object</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Two-bit order</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Debug check</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit wire</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">q0 and q1</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Which wire is controlled?</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Statevector</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">|q1q0&gt;</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Index 1 is 01</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Counts key</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">c1c0</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Read the leftmost bit as</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">c1</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="51" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">QuantLearn</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">q0 top, rightmost bit</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Normalize before comparing</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
