<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="rotation-reference-title rotation-reference-desc"><title id="rotation-reference-title">Fixed phases and continuous rotations</title><desc id="rotation-reference-desc">S and T are fixed phase steps; Rx, Ry and Rz use explicit radian angles.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Fixed phases and continuous rotations</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">S and T are fixed phase steps; Rx, Ry and Rz use explicit radian angles.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Gate</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Parameter</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Primary effect</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">S</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">π/2</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Phase on |1&gt;</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">T</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">π/4</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Smaller phase on |1&gt;</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Ry</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">θ</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Move probability between</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">|0&gt;, |1&gt;</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Rz</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">θ</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Change relative phase</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">around Z</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
