<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="grover-circuit-title grover-circuit-desc"><title id="grover-circuit-title">Grover search with two qubits</title><desc id="grover-circuit-desc">The first CZ marks 11. The remaining H-X-CZ-X-H block implements −D.</desc><rect width="960" height="430" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Grover search with two qubits</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The first CZ marks 11. The remaining H-X-CZ-X-H block implements −D.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: |0&gt;</text><line x1="135" y1="175" x2="905" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="267" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="135" y1="260" x2="905" y2="260" stroke="#62556f" stroke-width="2" /><rect x="152" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="152" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><line x1="267.5" y1="175" x2="267.5" y2="260" stroke="#7c3aed" stroke-width="2" /><circle cx="267.5" cy="175" r="6" fill="#7c3aed"/><circle cx="267.5" cy="260" r="6" fill="#7c3aed"/><rect x="337" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="360" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="337" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="360" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="429.5" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="452.5" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><rect x="429.5" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="452.5" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><line x1="545" y1="175" x2="545" y2="260" stroke="#7c3aed" stroke-width="2" /><circle cx="545" cy="175" r="6" fill="#7c3aed"/><circle cx="545" cy="260" r="6" fill="#7c3aed"/><rect x="614.5" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="637.5" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><rect x="614.5" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="637.5" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><rect x="707" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="730" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="707" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="730" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="801.5" y="154" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="822.5" y="182" font-size="18" fill="#221536" text-anchor="middle">M</text><rect x="801.5" y="239" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="822.5" y="267" font-size="18" fill="#221536" text-anchor="middle">M</text><text x="40" y="350" font-size="18" fill="#62556f" text-anchor="start">Before measurement the amplitude of |11&gt; is −1: a global-phase difference from</text><text x="40" y="376" font-size="18" fill="#62556f" text-anchor="start">mathematical D.</text></g></svg>
