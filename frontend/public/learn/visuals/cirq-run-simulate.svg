<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="cirq-run-simulate-title cirq-run-simulate-desc"><title id="cirq-run-simulate-title">Cirq run and simulate answer different questions</title><desc id="cirq-run-simulate-desc">Use run for repeated measured outputs and simulate for an exact unmeasured state or trajectory.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Cirq run and simulate answer different questions</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Use run for repeated measured outputs and simulate for an exact unmeasured state or</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">trajectory.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Call</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Output</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Use when</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">simulator.run</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Measurement records</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">You need repetitions and</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">counts</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="51" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">simulator.simulate</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">Final state</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">You need amplitudes</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="51" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">repetitions=N</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">Finite samples</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Estimate frequencies</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="51" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">qubit_order=[q1,q0]</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Stable tensor order</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Compare with QuantLearn</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
