<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="dj-circuit-title dj-circuit-desc"><title id="dj-circuit-title">Deutsch-Jozsa: balanced XOR oracle</title><desc id="dj-circuit-desc">The two CX gates together implement one oracle call for f(q1,q0)=q1 XOR q0.</desc><rect width="960" height="515" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Deutsch-Jozsa: balanced XOR oracle</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The two CX gates together implement one oracle call for f(q1,q0)=q1 XOR q0.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: |0&gt;</text><line x1="135" y1="175" x2="905" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="267" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="135" y1="260" x2="905" y2="260" stroke="#62556f" stroke-width="2" /><text x="40" y="352" font-size="20" fill="#221536" text-anchor="start">q2: |0&gt;</text><line x1="135" y1="345" x2="905" y2="345" stroke="#62556f" stroke-width="2" /><rect x="152" y="322" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="352" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><rect x="152" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="152" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="267" y="322" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="290" y="352" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><line x1="405" y1="175" x2="405" y2="345" stroke="#7c3aed" stroke-width="2" /><circle cx="405" cy="175" r="6" fill="#7c3aed"/><circle cx="405" cy="345" r="17" fill="#fff" stroke="#7c3aed" stroke-width="2"/><line x1="393" y1="345" x2="417" y2="345" stroke="#7c3aed" stroke-width="2" /><line x1="405" y1="333" x2="405" y2="357" stroke="#7c3aed" stroke-width="2" /><line x1="520" y1="260" x2="520" y2="345" stroke="#7c3aed" stroke-width="2" /><circle cx="520" cy="260" r="6" fill="#7c3aed"/><circle cx="520" cy="345" r="17" fill="#fff" stroke="#7c3aed" stroke-width="2"/><line x1="508" y1="345" x2="532" y2="345" stroke="#7c3aed" stroke-width="2" /><line x1="520" y1="333" x2="520" y2="357" stroke="#7c3aed" stroke-width="2" /><rect x="497" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="520" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="612" y="237" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="635" y="267" font-size="18" fill="#7c3aed" text-anchor="middle">H</text><rect x="729" y="154" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="750" y="182" font-size="18" fill="#221536" text-anchor="middle">M</text><rect x="729" y="239" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="750" y="267" font-size="18" fill="#221536" text-anchor="middle">M</text><text x="40" y="435" font-size="18" fill="#62556f" text-anchor="start">q2 starts in |1&gt; then H prepares |−&gt;. Measure q1q0 only: the XOR instance returns 11.</text></g></svg>
