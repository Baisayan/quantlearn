<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="mixed-bloch-title mixed-bloch-desc"><title id="mixed-bloch-title">Pure and mixed states on the Bloch sphere</title><desc id="mixed-bloch-desc">A pure one-qubit state lies on the surface; a maximally mixed reduced state sits at the center.</desc><rect width="960" height="540" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Pure and mixed states on the Bloch sphere</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A pure one-qubit state lies on the surface; a maximally mixed reduced state sits at the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">center.</text><circle cx="245" cy="300" r="142" fill="#faf8ff" stroke="#c4b5fd" stroke-width="2"/><ellipse cx="245" cy="300" rx="142" ry="70" fill="none" stroke="#c4b5fd"/><line x1="103" y1="300" x2="387" y2="300" stroke="#c4b5fd"/><line x1="245" y1="158" x2="245" y2="442" stroke="#c4b5fd"/><line x1="245" y1="300" x2="330" y2="220" stroke="#7c3aed" stroke-width="5"/><circle cx="330" cy="220" r="9" fill="#7c3aed"/><text x="245" y="130" font-size="21" fill="#221536" text-anchor="middle">pure: |0&gt;</text><circle cx="690" cy="300" r="142" fill="#faf8ff" stroke="#c4b5fd" stroke-width="2"/><ellipse cx="690" cy="300" rx="142" ry="70" fill="none" stroke="#c4b5fd"/><line x1="548" y1="300" x2="832" y2="300" stroke="#c4b5fd"/><line x1="690" y1="158" x2="690" y2="442" stroke="#c4b5fd"/><circle cx="690" cy="300" r="12" fill="#a78bfa"/><text x="690" y="130" font-size="21" fill="#221536" text-anchor="middle">mixed: I/2</text><text x="245" y="490" font-size="19" fill="#62556f" text-anchor="middle">surface vector, length 1</text><text x="690" y="490" font-size="19" fill="#62556f" text-anchor="middle">center vector, length 0</text></g></svg>
