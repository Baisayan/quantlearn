<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="phase-comparison-title phase-comparison-desc"><title id="phase-comparison-title">Same probabilities, different phase</title><desc id="phase-comparison-desc">All entries refer to the Z basis before any analyzing gate.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Same probabilities, different phase</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">All entries refer to the Z basis before any analyzing gate.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Amplitudes [0, 1]</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">P(0), P(1)</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Plus</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">[1/√2, 1/√2]</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">1/2, 1/2</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Minus</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">[1/√2, −1/√2]</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">1/2, 1/2</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">i × Plus</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">[i/√2, i/√2]</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">1/2, 1/2; global phase</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">only</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /></g></svg>
