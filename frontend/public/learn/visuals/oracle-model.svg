<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 527" role="img" aria-labelledby="oracle-model-title oracle-model-desc"><title id="oracle-model-title">A Boolean rule becomes a reversible query</title><desc id="oracle-model-desc">An oracle keeps the input x and XORs f(x) into a helper bit y. The helper can turn that bit action into a phase.</desc><rect width="960" height="527" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A Boolean rule becomes a reversible query</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">An oracle keeps the input x and XORs f(x) into a helper bit y. The helper can turn that</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">bit action into a phase.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Stage</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Register</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Meaning</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Input</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|x&gt;|y&gt;</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Keep x available for</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">reversibility</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Oracle</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">U_f|x&gt;|y&gt; = |x&gt;|y⊕f(x)&gt;</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Query the promised Boolean</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">function</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="78" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Output</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">x, y⊕f(x)</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">Read y for a bit flip or</text><text x="640.6666666666666" y="392" font-size="19" fill="#221536" text-anchor="start">analyze a phase</text><line x1="40" y1="413" x2="920" y2="413" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="413" width="880" height="78" fill="#fff"/><text x="54" y="443" font-size="19" fill="#221536" text-anchor="start">Abstraction</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">One query</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">The gates implementing U_f</text><text x="640.6666666666666" y="470" font-size="19" fill="#221536" text-anchor="start">are counted separately</text><line x1="40" y1="491" x2="920" y2="491" stroke="#ddd6e8" stroke-width="2" /></g></svg>
