<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="information-models-title information-models-desc"><title id="information-models-title">Three ways to describe information</title><desc id="information-models-desc">A bit is a value, a distribution is a prediction, and a qubit state includes amplitudes and phase.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Three ways to describe information</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A bit is a value, a distribution is a prediction, and a qubit state includes amplitudes</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">and phase.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Object</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Description</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">What one readout gives</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Classical bit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0 or 1</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">The stored value</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Classical distribution</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">P(0), P(1)</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">One sampled outcome</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Qubit</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">α|0&gt; + β|1&gt;</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">One basis outcome; phase</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">needs an analyzer</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /></g></svg>
