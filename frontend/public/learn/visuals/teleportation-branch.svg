<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="teleportation-branch-title teleportation-branch-desc"><title id="teleportation-branch-title">A complex input through two branches</title><desc id="teleportation-branch-desc">Tracking amplitudes catches phase errors that tests using only |0&gt; and |1&gt; can miss.</desc><rect width="960" height="368" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">A complex input through two branches</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Tracking amplitudes catches phase errors that tests using only |0&gt; and |1&gt; can miss.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Branch</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Bob before correction</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">After correction</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">10</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">[√3/2, −i/2]</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">[√3/2, i/2]</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">11</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">[−i/2, √3/2]</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">[√3/2, i/2]</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Any branch</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">one of Iψ, Xψ, Zψ, XZψ</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">ψ up to global phase</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /></g></svg>
