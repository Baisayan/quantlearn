<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="qaoa-loop-title qaoa-loop-desc"><title id="qaoa-loop-title">QAOA alternates quantum evaluation and classical search</title><desc id="qaoa-loop-desc">The optimizer proposes parameters; the circuit returns sampled scores; the loop stops when progress is sufficient.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">QAOA alternates quantum evaluation and classical search</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The optimizer proposes parameters; the circuit returns sampled scores; the loop stops when</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">progress is sufficient.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Step</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Actor</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Output</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">1</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Classical optimizer</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">γ, β</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">2</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Quantum circuit</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Bitstring samples</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">3</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Score function</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Cut scores and mean</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">4</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">Update</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">New parameters or stop</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
