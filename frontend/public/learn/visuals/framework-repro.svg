<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" role="img" aria-labelledby="framework-repro-title framework-repro-desc"><title id="framework-repro-title">Reproducibility needs metadata</title><desc id="framework-repro-desc">A seed is only one part of a reproducible simulator run and does not guarantee identical samples across libraries.</desc><rect width="960" height="524" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Reproducibility needs metadata</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A seed is only one part of a reproducible simulator run and does not guarantee identical</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">samples across libraries.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Metadata</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Why it matters</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">fixture ID and operations</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Defines the experiment</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Engine</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Aer, Cirq or default.qubit</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Different sampling</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">implementations</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="78" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Shots</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">1024</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Sets finite-sample</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">variation</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="386" width="880" height="51" fill="#fff"/><text x="54" y="416" font-size="19" fill="#221536" text-anchor="start">Seed</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">42</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">Repeatable within a setup</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="437" width="880" height="51" fill="#faf8ff"/><text x="54" y="467" font-size="19" fill="#221536" text-anchor="start">Order</text><text x="347.3333333333333" y="467" font-size="19" fill="#221536" text-anchor="start">q1q0 display</text><text x="640.6666666666666" y="467" font-size="19" fill="#221536" text-anchor="start">Prevents false mismatches</text><line x1="40" y1="488" x2="920" y2="488" stroke="#ddd6e8" stroke-width="2" /></g></svg>
