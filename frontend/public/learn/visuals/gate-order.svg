<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 317" role="img" aria-labelledby="gate-order-title gate-order-desc"><title id="gate-order-title">Gate order can change the answer</title><desc id="gate-order-desc">The last H is an X-basis analyzer for the state produced by the first two gates.</desc><rect width="960" height="317" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Gate order can change the answer</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The last H is an X-basis analyzer for the state produced by the first two gates.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Read left → right</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Before analyzer</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Final outcome</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt; → X → H → H → M</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Minus</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">|0&gt; → H → X → H → M</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Plus</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /></g></svg>
