<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="qaoa-graph-title qaoa-graph-desc"><title id="qaoa-graph-title">MaxCut starts with a graph and a score</title><desc id="qaoa-graph-desc">For one edge, a cut separates the two vertices. The bitstring encodes each vertex side.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">MaxCut starts with a graph and a score</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">For one edge, a cut separates the two vertices. The bitstring encodes each vertex side.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Bitstring</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Same or different</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Cut score</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">00</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">same</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">01</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">different</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">10</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">different</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">11</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">same</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
