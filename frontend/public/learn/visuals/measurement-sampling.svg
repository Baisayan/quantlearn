<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="measurement-sampling-title measurement-sampling-desc"><title id="measurement-sampling-title">More shots narrow sampling noise</title><desc id="measurement-sampling-desc">Exact probabilities stay fixed while finite-shot estimates vary around them.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">More shots narrow sampling noise</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Exact probabilities stay fixed while finite-shot estimates vary around them.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Shots</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Expected zeros</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Typical interpretation</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">16</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">12</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Noticeable fluctuation</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">100</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">75</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Useful estimate</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">1,024</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">768</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Smaller sampling</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">uncertainty</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Any N</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">0.75N</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Bias is not removed by</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">more shots</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
