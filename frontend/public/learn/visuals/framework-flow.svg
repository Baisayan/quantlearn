<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 527" role="img" aria-labelledby="framework-flow-title framework-flow-desc"><title id="framework-flow-title">Choose the simulation result you need</title><desc id="framework-flow-desc">Aer, Cirq and PennyLane offer different APIs for the same ideal experiment. Name the representation explicitly.</desc><rect width="960" height="527" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Choose the simulation result you need</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Aer, Cirq and PennyLane offer different APIs for the same ideal experiment. Name the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">representation explicitly.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Question</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Use</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Interpretation</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Which bits were observed?</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Sampled measurements</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Counts from a stated</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">number of shots</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">What are the amplitudes?</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">Unmeasured pure-state</text><text x="347.3333333333333" y="314" font-size="19" fill="#221536" text-anchor="start">simulation</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Exact statevector, up to</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">numerical precision</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="78" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">How does phase affect the</text><text x="54" y="392" font-size="19" fill="#221536" text-anchor="start">circuit?</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">State inspection or a</text><text x="347.3333333333333" y="392" font-size="19" fill="#221536" text-anchor="start">basis analyzer</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">One Z histogram omits</text><text x="640.6666666666666" y="392" font-size="19" fill="#221536" text-anchor="start">relative phase</text><line x1="40" y1="413" x2="920" y2="413" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="413" width="880" height="78" fill="#fff"/><text x="54" y="443" font-size="19" fill="#221536" text-anchor="start">What is the noisy</text><text x="54" y="470" font-size="19" fill="#221536" text-anchor="start">ensemble?</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">Density-matrix simulation</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">Mixed state, not just one</text><text x="640.6666666666666" y="470" font-size="19" fill="#221536" text-anchor="start">random trajectory</text><line x1="40" y1="491" x2="920" y2="491" stroke="#ddd6e8" stroke-width="2" /></g></svg>
