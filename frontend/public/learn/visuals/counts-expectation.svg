<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="counts-expectation-title counts-expectation-desc"><title id="counts-expectation-title">Counts become an expectation estimate</title><desc id="counts-expectation-desc">Assign +1 to the positive eigenvalue and −1 to the negative one, then average over shots.</desc><rect width="960" height="368" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Counts become an expectation estimate</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Assign +1 to the positive eigenvalue and −1 to the negative one, then average over shots.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Counts</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Formula</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Estimate</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">70 positive, 30 negative</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">(70−30)/100</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">0.40</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">512 positive, 512 negative</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">(512−512)/1024</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">p(positive)=p</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">p−(1−p)</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">2p−1</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /></g></svg>
