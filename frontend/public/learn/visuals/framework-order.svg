<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="framework-order-title framework-order-desc"><title id="framework-order-title">One basis convention across three engines</title><desc id="framework-order-desc">Use the asymmetric X(q0) example to verify each adapter, not only a symmetric Bell pair.</desc><rect width="960" height="470" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">One basis convention across three engines</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Use the asymmetric X(q0) example to verify each adapter, not only a symmetric Bell pair.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">View</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Order</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Expected representation</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">q0 on top; q1 below</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">X applied to q0</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Qiskit statevector</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">|q1q0&gt;</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">[0,1,0,0]</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Cirq statevector</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">qubit_order=[q1,q0]</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">[0,1,0,0]</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">PennyLane statevector</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">integer wires [0,1]</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">[0,1,0,0]</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="383" width="880" height="51" fill="#faf8ff"/><text x="54" y="413" font-size="19" fill="#221536" text-anchor="start">Cirq measurement</text><text x="347.3333333333333" y="413" font-size="19" fill="#221536" text-anchor="start">measure(q1,q0)</text><text x="640.6666666666666" y="413" font-size="19" fill="#221536" text-anchor="start">Bitstring 01</text><line x1="40" y1="434" x2="920" y2="434" stroke="#ddd6e8" stroke-width="2" /></g></svg>
