<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-labelledby="observable-bases-title observable-bases-desc"><title id="observable-bases-title">Different observables need different analyzers</title><desc id="observable-bases-desc">A Pauli observable has eigenvalues ±1. A basis-changing gate maps X or Y eigenstates to a Z detector.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Different observables need different analyzers</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A Pauli observable has eigenvalues ±1. A basis-changing gate maps X or Y eigenstates to a</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">Z detector.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Observable</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Eigenvalues</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Measurement circuit</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Z</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">+1 for 0; −1 for 1</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Prepare → measure Z</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">X</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">+1 for +; −1 for −</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Prepare → H → measure Z</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Y</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">+1 for +i; −1 for −i</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Prepare → S† → H → measure</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Z</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /></g></svg>
