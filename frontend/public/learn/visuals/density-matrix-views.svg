<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="density-matrix-views-title density-matrix-views-desc"><title id="density-matrix-views-title">One preparation, two representations</title><desc id="density-matrix-views-desc">A statevector stores amplitudes for a pure state; a density matrix also represents mixtures and subsystem descriptions.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">One preparation, two representations</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A statevector stores amplitudes for a pure state; a density matrix also represents</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">mixtures and subsystem descriptions.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">View</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Expression</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">What it preserves</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Statevector</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|ψ&gt; = α|0&gt; + β|1&gt;</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Amplitudes up to global</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">phase</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Pure density matrix</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">ρ = |ψ&gt;&lt;ψ|</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Probabilities and</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">coherence</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="51" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Classical mixture</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">ρ = Σ pᵢ|ψᵢ&gt;&lt;ψᵢ|</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">Ensemble predictions</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="386" width="880" height="51" fill="#fff"/><text x="54" y="416" font-size="19" fill="#221536" text-anchor="start">Reduced state</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">ρ_A = Tr_B(ρ_AB)</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">Local predictions only</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
