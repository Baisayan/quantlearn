<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="interference-amplitudes-title interference-amplitudes-desc"><title id="interference-amplitudes-title">Signed amplitudes can cancel</title><desc id="interference-amplitudes-desc">The two paths add as amplitudes first; only then are squared to produce probabilities.</desc><rect width="960" height="368" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Signed amplitudes can cancel</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The two paths add as amplitudes first; only then are squared to produce probabilities.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Amplitude of |0&gt;</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Amplitude of |1&gt;</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Plus</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">+1/√2</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">+1/√2</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Minus</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">+1/√2</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">−1/√2</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">After final H</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">1 or 0</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">0 or 1</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /></g></svg>
