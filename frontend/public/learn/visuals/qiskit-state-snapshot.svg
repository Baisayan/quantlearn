<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="qiskit-state-snapshot-title qiskit-state-snapshot-desc"><title id="qiskit-state-snapshot-title">Exact snapshots are separate from measured counts</title><desc id="qiskit-state-snapshot-desc">Save a state before measurement when you need amplitudes; counts describe repeated classical outcomes.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Exact snapshots are separate from measured counts</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Save a state before measurement when you need amplitudes; counts describe repeated</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">classical outcomes.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Need</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Aer pattern</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Returned data</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Counts</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">run(circuit, shots=N)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">get_counts()</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Statevector</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">save_statevector()</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Exact amplitudes</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Density matrix</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">save_density_matrix()</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Mixed-state matrix</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="78" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Both</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">Separate compatible runs</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Do not read a collapsed</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">state as pre-measurement</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
