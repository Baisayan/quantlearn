<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="simulation-scaling-title simulation-scaling-desc"><title id="simulation-scaling-title">Dense simulation size grows with qubit count</title><desc id="simulation-scaling-desc">Dense statevector storage has 2^n amplitudes and dense density-matrix storage has 4^n entries.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Dense simulation size grows with qubit count</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Dense statevector storage has 2^n amplitudes and dense density-matrix storage has 4^n</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">entries.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Qubits</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Statevector entries</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Density-matrix entries</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">1</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">2</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">4</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">2</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">4</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">16</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">3</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">8</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">64</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">n</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">2^n</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">4^n</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
