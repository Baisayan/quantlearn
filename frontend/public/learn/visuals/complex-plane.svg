<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="complex-plane-title complex-plane-desc"><title id="complex-plane-title">Complex amplitudes on a plane</title><desc id="complex-plane-desc">Magnitude is distance from the origin; phase is the angle. Squared magnitude becomes probability.</desc><rect width="960" height="550" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Complex amplitudes on a plane</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Magnitude is distance from the origin; phase is the angle. Squared magnitude becomes</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">probability.</text><line x1="125" y1="260" x2="835" y2="260" stroke="#62556f" stroke-width="2" /><line x1="480" y1="90" x2="480" y2="430" stroke="#62556f" stroke-width="2" /><line x1="480" y1="260" x2="635" y2="155" stroke="#7c3aed" stroke-width="2" stroke-width="4"/><circle cx="635" cy="155" r="9" fill="#7c3aed"/><text x="850" y="266" font-size="18" fill="#62556f" text-anchor="start">Re</text><text x="488" y="105" font-size="18" fill="#62556f" text-anchor="start">Im</text><text x="646" y="145" font-size="20" fill="#7c3aed" text-anchor="start">1/√2 + i/√2</text><text x="510" y="315" font-size="20" fill="#221536" text-anchor="start">Magnitude² = 1</text><text x="110" y="480" font-size="18" fill="#62556f" text-anchor="start">The angle carries phase; the distance from the origin controls</text><text x="110" y="506" font-size="18" fill="#62556f" text-anchor="start">magnitude.</text></g></svg>
