<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="bit-order-title bit-order-desc"><title id="bit-order-title">Top wire does not mean leftmost bit</title><desc id="bit-order-desc">An asymmetric example exposes accidental bit reversal.</desc><rect width="960" height="430" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Top wire does not mean leftmost bit</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">An asymmetric example exposes accidental bit reversal.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: |0&gt;</text><line x1="135" y1="175" x2="905" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="267" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="135" y1="260" x2="905" y2="260" stroke="#62556f" stroke-width="2" /><rect x="152" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="175" y="182" font-size="18" fill="#7c3aed" text-anchor="middle">X</text><rect x="269" y="154" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="290" y="182" font-size="18" fill="#221536" text-anchor="middle">M</text><rect x="269" y="239" width="42" height="42" rx="6" fill="#fff" stroke="#7c3aed"/><text x="290" y="267" font-size="18" fill="#221536" text-anchor="middle">M</text><text x="40" y="350" font-size="18" fill="#62556f" text-anchor="start">Expected basis order: 00, 01, 10, 11. Statevector: [0, 1, 0, 0]. Outcome: 01.</text></g></svg>
