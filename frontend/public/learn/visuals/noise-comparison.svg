<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="noise-comparison-title noise-comparison-desc"><title id="noise-comparison-title">Noise changes the underlying distribution</title><desc id="noise-comparison-desc">Prepare plus, apply a random Z with probability p, then H and Z measurement.</desc><rect width="960" height="515" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Noise changes the underlying distribution</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Prepare plus, apply a random Z with probability p, then H and Z measurement.</text><rect x="80" y="116" width="18" height="18" fill="#7c3aed"/><text x="106" y="132" font-size="18" fill="#221536" text-anchor="start">Ideal: p = 0</text><rect x="360" y="116" width="18" height="18" fill="#c4b5fd"/><text x="386" y="132" font-size="18" fill="#221536" text-anchor="start">Phase flip: p = 1/4</text><line x1="78" y1="370" x2="905" y2="370" stroke="#62556f" stroke-width="2" /><text x="66" y="376" font-size="17" fill="#62556f" text-anchor="end">0</text><line x1="78" y1="265" x2="905" y2="265" stroke="#eee8f5" stroke-width="2" /><text x="66" y="271" font-size="17" fill="#62556f" text-anchor="end">0.5</text><line x1="78" y1="160" x2="905" y2="160" stroke="#eee8f5" stroke-width="2" /><text x="66" y="166" font-size="17" fill="#62556f" text-anchor="end">1</text><rect x="205" y="160" width="86" height="210" fill="#7c3aed"/><text x="248" y="151" font-size="17" fill="#221536" text-anchor="middle">1</text><rect x="295" y="212.5" width="86" height="157.5" fill="#c4b5fd"/><text x="338" y="203.5" font-size="17" fill="#221536" text-anchor="middle">0.75</text><text x="293" y="410" font-size="20" fill="#221536" text-anchor="middle">0</text><rect x="605" y="370" width="86" height="0.5" fill="#7c3aed"/><text x="648" y="361" font-size="17" fill="#221536" text-anchor="middle">0</text><rect x="695" y="317.5" width="86" height="52.5" fill="#c4b5fd"/><text x="738" y="308.5" font-size="17" fill="#221536" text-anchor="middle">0.25</text><text x="693" y="410" font-size="20" fill="#221536" text-anchor="middle">1</text><text x="40" y="451" font-size="18" fill="#62556f" text-anchor="start">These are exact channel predictions. Finite-shot fluctuations are a separate effect.</text></g></svg>
