<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 317" role="img" aria-labelledby="interference-title interference-desc"><title id="interference-title">Interference paths</title><desc id="interference-desc">Time runs left to right. The final Hadamard reveals a relative-phase difference.</desc><rect width="960" height="317" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Interference paths</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Time runs left to right. The final Hadamard reveals a relative-phase difference.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Circuit from |0&gt;</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">State before final H</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Final Z outcome</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt; → H → H → M</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Plus</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">0 with probability 1</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">|0&gt; → H → Z → H → M</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Minus</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">1 with probability 1</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /></g></svg>
