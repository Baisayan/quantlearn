<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="grover-success-title grover-success-desc"><title id="grover-success-title">Amplitude amplification has a stopping point</title><desc id="grover-success-desc">The success curve rises near the marked subspace, then oscillates because the iteration is a rotation.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Amplitude amplification has a stopping point</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The success curve rises near the marked subspace, then oscillates because the iteration is</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">a rotation.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">r</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">sin²((2r+1)θ)</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Interpretation</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0.25</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Uniform guess</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">1</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">1.00</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Peak for this four-item</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">example</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="51" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">2</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">0.25</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Overshoot</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">About π/(4θ)</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">Near maximum</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Round to an integer</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">iteration</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
