<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="shot-noise-expectation-title shot-noise-expectation-desc"><title id="shot-noise-expectation-title">More shots reduce sampling noise, not model bias</title><desc id="shot-noise-expectation-desc">The exact expectation is fixed; finite samples fluctuate around it and independent terms need independent estimates.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">More shots reduce sampling noise, not model bias</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The exact expectation is fixed; finite samples fluctuate around it and independent terms</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">need independent estimates.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Shots</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Exact mean</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Typical role</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">32</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0.40</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Noisy teaching example</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">256</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">0.40</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Usable estimate</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="78" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">1,024</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">0.40</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Narrower sampling</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">variation</text><line x1="40" y1="359" x2="920" y2="359" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="359" width="880" height="78" fill="#fff"/><text x="54" y="389" font-size="19" fill="#221536" text-anchor="start">Any N</text><text x="347.3333333333333" y="389" font-size="19" fill="#221536" text-anchor="start">0.40</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">Does not correct a faulty</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">circuit</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
