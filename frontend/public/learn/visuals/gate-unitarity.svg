<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" role="img" aria-labelledby="gate-unitarity-title gate-unitarity-desc"><title id="gate-unitarity-title">Why ideal gates are reversible</title><desc id="gate-unitarity-desc">U†U=I preserves norm, orthogonality and the ability to undo an operation.</desc><rect width="960" height="422" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Why ideal gates are reversible</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">U†U=I preserves norm, orthogonality and the ability to undo an operation.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Check</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Meaning</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">U†U = I</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Inverse exists</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">H† = H</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">||Uψ|| = ||ψ||</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Probabilities remain</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">normalized</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">X keeps total 1</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="78" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Distinct inputs stay</text><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">distinct</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">No reset by unitary alone</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">|0&gt;, |1&gt; remain orthogonal</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /></g></svg>
