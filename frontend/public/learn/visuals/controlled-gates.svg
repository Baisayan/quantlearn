<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="controlled-gates-title controlled-gates-desc"><title id="controlled-gates-title">Control and target semantics</title><desc id="controlled-gates-desc">The control decides whether the target operation is applied; the control is not itself flipped by CX.</desc><rect width="960" height="470" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Control and target semantics</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The control decides whether the target operation is applied; the control is not itself</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">flipped by CX.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Gate</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Input</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Output</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">CX(q0,q1)</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">00</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">00</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">CX(q0,q1)</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">01</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">11</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">CX(q0,q1)</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">10</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">10</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">CZ(q0,q1)</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">11</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">−|11&gt;</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="383" width="880" height="51" fill="#faf8ff"/><text x="54" y="413" font-size="19" fill="#221536" text-anchor="start">SWAP</text><text x="347.3333333333333" y="413" font-size="19" fill="#221536" text-anchor="start">01</text><text x="640.6666666666666" y="413" font-size="19" fill="#221536" text-anchor="start">10</text><line x1="40" y1="434" x2="920" y2="434" stroke="#ddd6e8" stroke-width="2" /></g></svg>
