<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" role="img" aria-labelledby="one-shot-title one-shot-desc"><title id="one-shot-title">One shot reveals one classical result</title><desc id="one-shot-desc">Repeated fresh preparations reveal a distribution; a single measurement does not print the statevector.</desc><rect width="960" height="446" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">One shot reveals one classical result</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Repeated fresh preparations reveal a distribution; a single measurement does not print the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">statevector.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Preparation</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">One shot</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Many fresh shots</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt;</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">0</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">All 0 in the ideal Z basis</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">|1&gt;</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">1</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">All 1 in the ideal Z basis</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">|+&gt;</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">0 or 1</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">Approximately 50/50</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="78" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">Unknown state</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">One bit</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">Estimate selected</text><text x="640.6666666666666" y="389" font-size="19" fill="#221536" text-anchor="start">observables</text><line x1="40" y1="410" x2="920" y2="410" stroke="#ddd6e8" stroke-width="2" /></g></svg>
