<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="bit-order-debug-title bit-order-debug-desc"><title id="bit-order-debug-title">Find the bit-order bug</title><desc id="bit-order-debug-desc">Asymmetric states expose reversed display or measurement conventions.</desc><rect width="960" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Find the bit-order bug</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Asymmetric states expose reversed display or measurement conventions.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">View</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Expected</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Failure symptom</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">QuantLearn</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">q0 top, rightmost bit</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">X(q0) gives 01</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">Qiskit statevector</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">|q1q0&gt;</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">01 and 10 appear swapped</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">if reversed</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="78" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Cirq</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">explicit</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">qubit_order=[q1,q0]</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Default order disagrees</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="386" width="880" height="78" fill="#fff"/><text x="54" y="416" font-size="19" fill="#221536" text-anchor="start">PennyLane</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">wire labels need an</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">adapter</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">Visual wire order differs</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">from array order</text><line x1="40" y1="464" x2="920" y2="464" stroke="#ddd6e8" stroke-width="2" /></g></svg>
