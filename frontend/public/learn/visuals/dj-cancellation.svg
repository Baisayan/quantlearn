<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 419" role="img" aria-labelledby="dj-cancellation-title dj-cancellation-desc"><title id="dj-cancellation-title">Final Hadamards convert signs into evidence</title><desc id="dj-cancellation-desc">The input register sums signed paths. Constant signs add at the all-zero state; balanced signs cancel there.</desc><rect width="960" height="419" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Final Hadamards convert signs into evidence</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">The input register sums signed paths. Constant signs add at the all-zero state; balanced</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">signs cancel there.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Oracle class</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Signed phase pattern</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Amplitude at 00</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">constant zero</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">+,+,+,+</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">1</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">constant one</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">−,−,−,−</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">−1; probability 1</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">balanced XOR</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">+,−,−,+</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="332" width="880" height="51" fill="#fff"/><text x="54" y="362" font-size="19" fill="#221536" text-anchor="start">balanced XNOR</text><text x="347.3333333333333" y="362" font-size="19" fill="#221536" text-anchor="start">−,+,+,−</text><text x="640.6666666666666" y="362" font-size="19" fill="#221536" text-anchor="start">0</text><line x1="40" y1="383" x2="920" y2="383" stroke="#ddd6e8" stroke-width="2" /></g></svg>
