<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="teleportation-title teleportation-desc"><title id="teleportation-title">Teleportation with classical corrections</title><desc id="teleportation-desc">Prepare q1/q2 as a Bell pair. q0 is the input and q2 is Bob's output.</desc><rect width="960" height="550" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Teleportation with classical corrections</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Prepare q1/q2 as a Bell pair. q0 is the input and q2 is Bob's output.</text><text x="40" y="182" font-size="20" fill="#221536" text-anchor="start">q0: ψ</text><line x1="132" y1="175" x2="630" y2="175" stroke="#62556f" stroke-width="2" /><text x="40" y="282" font-size="20" fill="#221536" text-anchor="start">q1: |0&gt;</text><line x1="132" y1="275" x2="630" y2="275" stroke="#62556f" stroke-width="2" /><text x="40" y="382" font-size="20" fill="#221536" text-anchor="start">q2: |0&gt;</text><line x1="132" y1="375" x2="915" y2="375" stroke="#62556f" stroke-width="2" /><rect x="167" y="252" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="190" y="282" font-size="19" fill="#7c3aed" text-anchor="middle">H</text><line x1="275" y1="275" x2="275" y2="375" stroke="#7c3aed" stroke-width="2" /><circle cx="275" cy="275" r="6" fill="#7c3aed"/><circle cx="275" cy="375" r="16" fill="#fff" stroke="#7c3aed"/><line x1="264" y1="375" x2="286" y2="375" stroke="#7c3aed" stroke-width="2" /><line x1="275" y1="364" x2="275" y2="386" stroke="#7c3aed" stroke-width="2" /><line x1="380" y1="175" x2="380" y2="275" stroke="#7c3aed" stroke-width="2" /><circle cx="380" cy="175" r="6" fill="#7c3aed"/><circle cx="380" cy="275" r="16" fill="#fff" stroke="#7c3aed"/><line x1="369" y1="275" x2="391" y2="275" stroke="#7c3aed" stroke-width="2" /><line x1="380" y1="264" x2="380" y2="286" stroke="#7c3aed" stroke-width="2" /><rect x="452" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="475" y="182" font-size="19" fill="#7c3aed" text-anchor="middle">H</text><rect x="557" y="152" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="580" y="182" font-size="19" fill="#7c3aed" text-anchor="middle">M</text><rect x="557" y="252" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="580" y="282" font-size="19" fill="#7c3aed" text-anchor="middle">M</text><rect x="702" y="352" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="725" y="382" font-size="19" fill="#7c3aed" text-anchor="middle">X</text><rect x="817" y="352" width="46" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="840" y="382" font-size="19" fill="#7c3aed" text-anchor="middle">Z</text><text x="610" y="164" font-size="17" fill="#221536" text-anchor="start">m0</text><text x="610" y="264" font-size="17" fill="#221536" text-anchor="start">m1</text><path d="M603 175 H840 V350 M603 275 H725 V350" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="455" font-size="18" fill="#62556f" text-anchor="start">Dashed links are classical: m1 controls X, then m0 controls Z. Alice holds q0 and q1;</text><text x="40" y="481" font-size="18" fill="#62556f" text-anchor="start">Bob holds q2. Bob recovers ψ after receiving both bits.</text></g></svg>
