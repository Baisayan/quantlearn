<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="qiskit-pipeline-title qiskit-pipeline-desc"><title id="qiskit-pipeline-title">The Aer execution pipeline</title><desc id="qiskit-pipeline-desc">Building, transpiling, executing and reading a result are separate steps with separate failure modes.</desc><rect width="960" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">The Aer execution pipeline</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Building, transpiling, executing and reading a result are separate steps with separate</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">failure modes.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Step</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Qiskit object or call</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">What to inspect</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Build</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">QuantumCircuit</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Wires, gates and</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">measurements</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Compile</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">transpile(circuit,</text><text x="347.3333333333333" y="314" font-size="19" fill="#221536" text-anchor="start">simulator)</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Target-compatible</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">operations</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="78" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Execute</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">simulator.run(...,</text><text x="347.3333333333333" y="392" font-size="19" fill="#221536" text-anchor="start">shots=N)</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">Declared shots and seed</text><line x1="40" y1="413" x2="920" y2="413" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="413" width="880" height="51" fill="#fff"/><text x="54" y="443" font-size="19" fill="#221536" text-anchor="start">Read</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">result().get_counts()</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">Keys and total counts</text><line x1="40" y1="464" x2="920" y2="464" stroke="#ddd6e8" stroke-width="2" /></g></svg>
