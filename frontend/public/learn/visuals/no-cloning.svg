<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="no-cloning-title no-cloning-desc"><title id="no-cloning-title">Why one universal copier cannot exist</title><desc id="no-cloning-desc">A device that copies both basis states would have to copy their superposition in two incompatible ways.</desc><rect width="960" height="470" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Why one universal copier cannot exist</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">A device that copies both basis states would have to copy their superposition in two</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">incompatible ways.</text><line x1="135" y1="210" x2="825" y2="210" stroke="#62556f" stroke-width="2" /><text x="55" y="216" font-size="19" fill="#62556f" text-anchor="start">input</text><rect x="175" y="187" width="82" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="216" y="216" font-size="20" fill="#7c3aed" text-anchor="middle">|ψ&gt;</text><rect x="365" y="187" width="82" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="406" y="216" font-size="20" fill="#7c3aed" text-anchor="middle">U</text><line x1="447" y1="210" x2="610" y2="210" stroke="#7c3aed" stroke-width="2" /><line x1="610" y1="210" x2="610" y2="140" stroke="#7c3aed" stroke-width="2" /><line x1="610" y1="210" x2="610" y2="280" stroke="#7c3aed" stroke-width="2" /><line x1="610" y1="140" x2="720" y2="140" stroke="#7c3aed" stroke-width="2" /><line x1="610" y1="280" x2="720" y2="280" stroke="#7c3aed" stroke-width="2" /><rect x="720" y="117" width="105" height="46" rx="6" fill="#fff" stroke="#7c3aed"/><text x="772" y="146" font-size="19" fill="#221536" text-anchor="middle">|ψ&gt;|ψ&gt;</text><rect x="720" y="257" width="105" height="46" rx="6" fill="#fff" stroke="#7c3aed"/><text x="772" y="286" font-size="19" fill="#221536" text-anchor="middle">|0&gt;|0&gt;</text><text x="155" y="355" font-size="19" fill="#62556f" text-anchor="start">Linearity says U(α|0&gt; + β|1&gt;)|0&gt; must equal αU|0&gt;|0&gt; + βU|1&gt;|0&gt;.</text><text x="155" y="392" font-size="19" fill="#62556f" text-anchor="start">The two required outputs disagree for a general unknown superposition.</text></g></svg>
