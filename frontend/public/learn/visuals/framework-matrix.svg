<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" role="img" aria-labelledby="framework-matrix-title framework-matrix-desc"><title id="framework-matrix-title">Normalize before comparing frameworks</title><desc id="framework-matrix-desc">Equivalent implementations can differ in labels and storage order while describing the same physical state.</desc><rect width="960" height="473" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Normalize before comparing frameworks</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Equivalent implementations can differ in labels and storage order while describing the</text><text x="40" y="106" font-size="18" fill="#62556f" text-anchor="start">same physical state.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Comparison</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Normalize</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Then check</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">Gate names and wire map</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Logical operations</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="78" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">State</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">Basis order</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">Amplitudes up to global</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">phase</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="308" width="880" height="78" fill="#faf8ff"/><text x="54" y="338" font-size="19" fill="#221536" text-anchor="start">Counts</text><text x="347.3333333333333" y="338" font-size="19" fill="#221536" text-anchor="start">Bitstring order</text><text x="640.6666666666666" y="338" font-size="19" fill="#221536" text-anchor="start">Probabilities and total</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">shots</text><line x1="40" y1="386" x2="920" y2="386" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="386" width="880" height="51" fill="#fff"/><text x="54" y="416" font-size="19" fill="#221536" text-anchor="start">Expectations</text><text x="347.3333333333333" y="416" font-size="19" fill="#221536" text-anchor="start">Observable convention</text><text x="640.6666666666666" y="416" font-size="19" fill="#221536" text-anchor="start">Signed estimates</text><line x1="40" y1="437" x2="920" y2="437" stroke="#ddd6e8" stroke-width="2" /></g></svg>
