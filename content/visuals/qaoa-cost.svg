ht="105.00000000000004" fill="#c4b5fd"/><text x="437.5" y="255.99999999999994" font-size="17" fill="#221536" text-anchor="middle">0.5</text><text x="393" y="410" font-size="20" fill="#221536" text-anchor="middle">01</text><rect x="506" y="317.5" width="85" height="52.5" fill="#7c3aed"/><text x="548.5" y="308.5" font-size="17" fill="#221536" text-anchor="middle">0.25</text><rect x="595" y="264.99999999999994" width="85" height="105.00000000000004" fill="#c4b5fd"/><text x="637.5" y="255.99999999999994" font-size="17" fill="#221536" text-anchor="middle">0.5</text><text x="593" y="410" font-size="20" fill="#221536" text-anchor="middle">10</text><rect x="706" y="317.5" width="85" height="52.5" fill="#7c3aed"/><text x="748.5" y="308.5" font-size="17" fill="#221536" text-anchor="middle">0.25</text><rect x="795" y="370" width="85" height="0.5" fill="#c4b5fd"/><text x="837.5" y="361" font-size="17" fill="#221536" text-anchor="middle">0</text><text x="793" y="410" font-size="20" fill="#221536" text-anchor="middle">11</text><text x="40" y="451" font-size="18" fill="#62556f" text-anchor="start">Average score improves from 1/2 to 1 for this toy instance. It is not a practical</text><text x="40" y="477" font-size="18" fill="#62556f" text-anchor="start">speedup claim.</text></g></svg>
