<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="result-panels-title result-panels-desc"><title id="result-panels-title">Four views of the Bell experiment</title><desc id="result-panels-desc">Each panel answers a different question. A local view cannot replace the joint state.</desc><rect width="960" height="500" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Four views of the Bell experiment</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Each panel answers a different question. A local view cannot replace the joint state.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Panel</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Example content</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Interpretation</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="78" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Circuit</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">H(q0); CX(q0,q1)</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">Operations that prepare</text><text x="640.6666666666666" y="236" font-size="19" fill="#221536" text-anchor="start">the pair</text><line x1="40" y1="257" x2="920" y2="257" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="257" width="880" height="78" fill="#fff"/><text x="54" y="287" font-size="19" fill="#221536" text-anchor="start">Statevector</text><text x="347.3333333333333" y="287" font-size="19" fill="#221536" text-anchor="start">[1/√2, 0, 0, 1/√2]</text><text x="640.6666666666666" y="287" font-size="19" fill="#221536" text-anchor="start">Joint amplitudes in</text><text x="640.6666666666666" y="314" font-size="19" fill="#221536" text-anchor="start">00,01,10,11 order</text><line x1="40" y1="335" x2="920" y2="335" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="335" width="880" height="78" fill="#faf8ff"/><text x="54" y="365" font-size="19" fill="#221536" text-anchor="start">Histogram</text><text x="347.3333333333333" y="365" font-size="19" fill="#221536" text-anchor="start">P(00)=P(11)=1/2</text><text x="640.6666666666666" y="365" font-size="19" fill="#221536" text-anchor="start">Z probabilities; phase is</text><text x="640.6666666666666" y="392" font-size="19" fill="#221536" text-anchor="start">absent</text><line x1="40" y1="413" x2="920" y2="413" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="413" width="880" height="51" fill="#fff"/><text x="54" y="443" font-size="19" fill="#221536" text-anchor="start">Reduced Bloch</text><text x="347.3333333333333" y="443" font-size="19" fill="#221536" text-anchor="start">Both vectors at (0,0,0)</text><text x="640.6666666666666" y="443" font-size="19" fill="#221536" text-anchor="start">Each local state is I/2</text><line x1="40" y1="464" x2="920" y2="464" stroke="#ddd6e8" stroke-width="2" /></g></svg>
