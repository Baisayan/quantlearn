<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="vqe-measurements-title vqe-measurements-desc"><title id="vqe-measurements-title">Two measurement settings for one energy</title><desc id="vqe-measurements-desc">Prepare a fresh Ry(θ)|0&gt; for each shot in each setting. M is a Z detector.</desc><rect width="960" height="368" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Two measurement settings for one energy</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Prepare a fresh Ry(θ)|0&gt; for each shot in each setting. M is a Z detector.</text><rect x="40" y="128" width="880" height="51" fill="#ede9fe"/><text x="54" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Term</text><text x="347.3333333333333" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Read left → right</text><text x="640.6666666666666" y="158" font-size="19" fill="#7c3aed" text-anchor="start">Contribution to E</text><line x1="40" y1="179" x2="920" y2="179" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="179" width="880" height="51" fill="#faf8ff"/><text x="54" y="209" font-size="19" fill="#221536" text-anchor="start">Z</text><text x="347.3333333333333" y="209" font-size="19" fill="#221536" text-anchor="start">|0&gt; → Ry(θ) → M</text><text x="640.6666666666666" y="209" font-size="19" fill="#221536" text-anchor="start">(n0 − n1) / N</text><line x1="40" y1="230" x2="920" y2="230" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="230" width="880" height="51" fill="#fff"/><text x="54" y="260" font-size="19" fill="#221536" text-anchor="start">0.5 X</text><text x="347.3333333333333" y="260" font-size="19" fill="#221536" text-anchor="start">|0&gt; → Ry(θ) → H → M</text><text x="640.6666666666666" y="260" font-size="19" fill="#221536" text-anchor="start">0.5 × (n0 − n1) / N</text><line x1="40" y1="281" x2="920" y2="281" stroke="#ddd6e8" stroke-width="2" /><rect x="40" y="281" width="880" height="51" fill="#faf8ff"/><text x="54" y="311" font-size="19" fill="#221536" text-anchor="start">Combined</text><text x="347.3333333333333" y="311" font-size="19" fill="#221536" text-anchor="start">Separate preparations</text><text x="640.6666666666666" y="311" font-size="19" fill="#221536" text-anchor="start">E = mean(Z) + 0.5 mean(X)</text><line x1="40" y1="332" x2="920" y2="332" stroke="#ddd6e8" stroke-width="2" /></g></svg>
