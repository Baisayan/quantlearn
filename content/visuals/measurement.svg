<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="measurement-title measurement-desc"><title id="measurement-title">Exact probabilities and finite samples</title><desc id="measurement-desc">Fixed-seed synthetic samples illustrate sampling variation, not device noise.</desc><rect width="960" height="515" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#221536" text-anchor="start">Exact probabilities and finite samples</text><text x="40" y="80" font-size="18" fill="#62556f" text-anchor="start">Fixed-seed synthetic samples illustrate sampling variation, not device noise.</text><rect x="80" y="116" width="18" height="18" fill="#7c3aed"/><text x="106" y="132" font-size="18" fill="#221536" text-anchor="start">Exact probability</text><rect x="360" y="116" width="18" height="18" fill="#c4b5fd"/><text x="386" y="132" font-size="18" fill="#221536" text-anchor="start">16 shots / 16</text><rect x="640" y="116" width="18" height="18" fill="#a78bfa"/><text x="666" y="132" font-size="18" fill="#221536" text-anchor="start">1024 shots / 1024</text><line x1="78" y1="370" x2="905" y2="370" stroke="#62556f" stroke-width="2" /><text x="66" y="376" font-size="17" fill="#62556f" text-anchor="end">0</text><line x1="78" y1="265" x2="905" y2="265" stroke="#eee8f5" stroke-width="2" /><text x="66" y="271" font-size="17" fill="#62556f" text-anchor="end">0.5</text><line x1="78" y1="160" x2="905" y2="160" stroke="#eee8f5" stroke-width="2" /><text x="66" y="166" font-size="17" fill="#62556f" text-anchor="end">1</text><rect x="160" y="212.5" width="86" height="157.5" fill="#7c3aed"/><text x="203" y="203.5" font-size="17" fill="#221536" text-anchor="middle">0.75</text><rect x="250" y="212.5" width="86" height="157.5" fill="#c4b5fd"/><text x="293" y="203.5" font-size="17" fill="#221536" text-anchor="middle">0.75</text><rect x="340" y="213.3203125" width="86" height="156.6796875" fill="#a78bfa"/><text x="383" y="204.3203125" font-size="17" fill="#221536" text-anchor="middle">0.746</text><text x="293" y="410" font-size="20" fill="#221536" text-anchor="middle">0</text><rect x="560" y="317.5" width="86" height="52.5" fill="#7c3aed"/><text x="603" y="308.5" font-size="17" fill="#221536" text-anchor="middle">0.25</text><rect x="650" y="317.5" width="86" height="52.5" fill="#c4b5fd"/><text x="693" y="308.5" font-size="17" fill="#221536" text-anchor="middle">0.25</text><rect x="740" y="316.6796875" width="86" height="53.3203125" fill="#a78bfa"/><text x="783" y="307.6796875" font-size="17" fill="#221536" text-anchor="middle">0.254</text><text x="693" y="410" font-size="20" fill="#221536" text-anchor="middle">1</text><text x="40" y="451" font-size="18" fill="#62556f" text-anchor="start">Actual synthetic counts: 16 shots = [12,4]; 1024 shots = [764,260]. Bar height is</text><text x="40" y="477" font-size="18" fill="#62556f" text-anchor="start">relative frequency.</text></g></svg>
